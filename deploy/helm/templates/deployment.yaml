apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shadowred.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "shadowred.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shadowred.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shadowred.name" . }}
    spec:
      containers:
        - name: shadowred
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web", "--port", "9595"]
          ports:
            - containerPort: 9595
              name: web
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shadowred.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "shadowred.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "shadowred.name" . }}
  ports:
    - name: web
      port: {{ .Values.service.port }}
      targetPort: 9595